services:
  db:
    image: mysql:8.4
    container_name: registration-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - db-network

  backend:
    image: ${DOCKER_USERNAME}/multi-tier-backend:${IMAGE_TAG}
    container_name: registration-backend
    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - web-network
      - db-network

  frontend:
    image: ${DOCKER_USERNAME}/multi-tier-frontend:${IMAGE_TAG}
    container_name: registration-frontend
    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - web-network


  # =========================
  # NGINX PROXY
  # =========================
  proxy:
    image: ${DOCKER_USERNAME}/multi-tier-proxy:${IMAGE_TAG}
    container_name: registration-proxy
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - frontend
      - backend

    networks:
      - web-network


# =========================
# VOLUMES
# =========================
volumes:
  mysql_data:


# =========================
# NETWORKS
# =========================
networks:

  web-network:
    driver: bridge

  db-network:
    driver: bridge